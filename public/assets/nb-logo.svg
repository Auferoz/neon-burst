<svg xmlns="http://www.w3.org/2000/svg" viewBox="115 10 590 590" role="img" aria-labelledby="nb-logo-title">
  <title id="nb-logo-title">Neon Burst</title>
  <defs>
    <!-- Neon glow: blurred copy merged under the sharp stroke -->
    <filter id="nb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur-wide" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur-tight" />
      <feMerge>
        <feMergeNode in="blur-wide" />
        <feMergeNode in="blur-tight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- CRT scanlines: 3px visible, 1px gap -->
    <pattern id="nb-scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="3" fill="#fff" />
      <rect y="3" width="4" height="1" fill="#fff" opacity="0.35" />
    </pattern>
    <mask id="nb-scan-mask" maskUnits="userSpaceOnUse" x="115" y="10" width="590" height="590">
      <rect x="115" y="10" width="590" height="590" fill="url(#nb-scan)" />
    </mask>

    <linearGradient id="nb-prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#1e90ff" />
    </linearGradient>
    <linearGradient id="nb-beam-pink" gradientUnits="userSpaceOnUse" x1="370" y1="340" x2="655" y2="255">
      <stop offset="0" stop-color="#b026ff" />
      <stop offset="1" stop-color="#ff2d95" />
    </linearGradient>
    <linearGradient id="nb-beam-down" gradientUnits="userSpaceOnUse" x1="365" y1="385" x2="538" y2="562">
      <stop offset="0" stop-color="#b026ff" />
      <stop offset="1" stop-color="#ff2d95" />
    </linearGradient>
  </defs>

  <g filter="url(#nb-glow)" mask="url(#nb-scan-mask)" fill="none" stroke-linecap="round">
    <!-- Cyan rays -->
    <g stroke="#00e5ff" stroke-width="6">
      <line x1="342" y1="320" x2="585" y2="35" stroke-width="8" />
      <line x1="198" y1="163" x2="328" y2="298" />
      <line x1="312" y1="215" x2="331" y2="266" />
      <line x1="382" y1="224" x2="407" y2="186" />
      <line x1="390" y1="357" x2="510" y2="357" />
      <line x1="390" y1="378" x2="440" y2="394" />
      <line x1="462" y1="405" x2="556" y2="442" />
      <line x1="274" y1="456" x2="200" y2="537" />
      <line x1="346" y1="455" x2="373" y2="578" />
      <line x1="381" y1="450" x2="397" y2="482" />
    </g>

    <!-- Blue ray -->
    <line x1="455" y1="283" x2="508" y2="268" stroke="#1e90ff" stroke-width="5" />

    <!-- Pink rays -->
    <g stroke="#ff2d95" stroke-width="6">
      <line x1="362" y1="104" x2="357" y2="242" />
      <line x1="544" y1="179" x2="486" y2="224" />
      <line x1="441" y1="250" x2="396" y2="299" />
      <line x1="306" y1="448" x2="278" y2="514" />
    </g>

    <!-- Long gradient beams -->
    <line x1="370" y1="340" x2="655" y2="255" stroke="url(#nb-beam-pink)" stroke-width="7" />
    <line x1="365" y1="385" x2="538" y2="562" stroke="url(#nb-beam-down)" stroke-width="6" />

    <!-- Sparks -->
    <g fill="#00e5ff" stroke="none">
      <circle cx="425" cy="150" r="3.5" />
      <circle cx="297" cy="184" r="3" />
      <rect x="546" y="354" width="12" height="6" rx="2" />
      <circle cx="406" cy="500" r="2.5" />
    </g>

    <!-- Terminal prompt ">_" -->
    <polyline points="176,262 274,345 176,428" stroke="url(#nb-prompt)" stroke-width="22" stroke-linejoin="miter" stroke-linecap="square" />
    <rect x="288" y="392" width="72" height="20" rx="3" fill="#00e5ff" stroke="none" />
  </g>
</svg>

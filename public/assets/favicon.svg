<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Simplified mark for small sizes: ">_" + 5 thick rays, no scanlines -->
  <defs>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="fav-prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#1e90ff" />
    </linearGradient>
    <linearGradient id="fav-beam" gradientUnits="userSpaceOnUse" x1="36" y1="35" x2="58" y2="28">
      <stop offset="0" stop-color="#b026ff" />
      <stop offset="1" stop-color="#ff2d95" />
    </linearGradient>
  </defs>

  <!-- Dark tile so the neon reads on light browser tabs too -->
  <rect width="64" height="64" rx="12" fill="#06060a" />

  <g filter="url(#fav-glow)" fill="none" stroke-linecap="round">
    <line x1="35" y1="29" x2="55" y2="8" stroke="#00e5ff" stroke-width="4.5" />
    <line x1="30" y1="9" x2="29.5" y2="22" stroke="#ff2d95" stroke-width="3.5" />
    <line x1="37" y1="35" x2="57" y2="29" stroke="url(#fav-beam)" stroke-width="4" />
    <line x1="40" y1="42" x2="53" y2="55" stroke="#b026ff" stroke-width="3.5" />
    <line x1="34" y1="49" x2="36" y2="58" stroke="#00e5ff" stroke-width="3.5" />

    <polyline points="9,19 22,31 9,43" stroke="url(#fav-prompt)" stroke-width="6" stroke-linejoin="miter" stroke-linecap="square" />
    <rect x="22" y="39" width="12" height="5" rx="1" fill="#00e5ff" stroke="none" />
  </g>
</svg>
